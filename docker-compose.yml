services:
  karma-jar:
    build: .
    container_name: karma-jar
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - TZ=America/New_York
      # Uncomment once the app is served over HTTPS (see README):
      # - KARMA_SECURE_COOKIES=1
